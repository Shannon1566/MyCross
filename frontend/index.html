<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyCross 控制台</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #121b2e;
      --line: #23314b;
      --txt: #eaf0ff;
      --sub: #9fb0d2;
      --ok: #22c55e;
      --danger: #fb7185;
      --acc: #22d3ee
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: radial-gradient(1200px 700px at 20% -20%, #19305a 0%, transparent 65%), radial-gradient(900px 600px at 100% 0%, #0a3644 0%, transparent 60%), var(--bg);
      color: var(--txt)
    }

    .wrap {
      max-width: 1060px;
      margin: 22px auto;
      padding: 0 16px
    }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 14px;
      margin-bottom: 14px
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.1
    }

    .sub {
      font-size: 13px;
      color: var(--sub);
      margin-top: 3px
    }

    .badge {
      font-size: 12px;
      color: #cde6ff;
      border: 1px solid var(--line);
      background: #0f1729;
      padding: 8px 12px;
      border-radius: 999px
    }

    .grid {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 12px;
      align-items: start
    }

    .card {
      background: linear-gradient(180deg, #16233b, #111b2f);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 14px 12px
    }

    h3 {
      margin: 0 0 10px;
      font-size: 15px;
      letter-spacing: .2px
    }

    .row {
      display: grid;
      grid-template-columns: 122px 1fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px
    }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    label {
      font-size: 13px;
      color: var(--sub)
    }

    input,
    select,
    button {
      width: 100%;
      height: 38px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid #2b3d5c;
      background: #0c1425;
      color: var(--txt);
      font-size: 14px
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--acc);
      box-shadow: 0 0 0 3px rgba(34, 211, 238, .15)
    }

    button {
      cursor: pointer;
      font-weight: 700
    }

    .btn {
      background: #182742
    }

    .btn:hover {
      background: #1c2d4d
    }

    .pri {
      background: linear-gradient(135deg, #34d399, #22d3ee);
      border: 0;
      color: #032228
    }

    .danger {
      background: linear-gradient(135deg, #fb7185, #f43f5e);
      border: 0;
      color: #fff
    }

    .status {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #10192a
    }

    .left {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--danger);
      box-shadow: 0 0 10px rgba(251, 113, 133, .7)
    }

    .dot.on {
      background: var(--ok);
      box-shadow: 0 0 10px rgba(34, 197, 94, .7)
    }

    .swatch {
      height: 56px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgb(0, 255, 0)
    }

    .actions {
      display: flex;
      gap: 8px
    }

    .spin {
      display: grid;
      grid-template-columns: 36px 1fr 36px;
      gap: 6px;
      align-items: center
    }

    .spin input {
      height: 38px;
      padding: 0 8px;
      text-align: center;
      font-weight: 600
    }

    .spin button {
      height: 38px;
      padding: 0;
      font-size: 19px;
      line-height: 1;
      border-radius: 9px
    }

    @media (max-width:900px) {
      .grid {
        grid-template-columns: 1fr
      }

      .head {
        flex-direction: column;
        align-items: flex-start
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="head">
      <div>
        <div class="title">MyCross 控制台</div>
        <div class="sub">全新重构版 · Web UI + 本地服务</div>
      </div>
      <div class="badge">热键关闭准星: Ctrl + Alt + Shift + F12</div>
    </div>

    <div class="grid">
      <section class="card">
        <h3>配置管理</h3>
        <div class="row"><label>已存在配置</label><select id="profileSelect"></select></div>
        <div class="row"><label>配置名</label><input id="profileName" placeholder="例如: sniper.ini" /></div>
        <div class="row2">
          <button class="btn" id="newBtn">新建</button>
          <button class="btn" id="renameBtn">重命名</button>
        </div>
        <div class="row2" style="margin-top:8px;">
          <button class="pri" id="saveBtn">保存当前配置</button>
          <button class="danger" id="quitBtn">退出程序</button>
        </div>
      </section>

      <section class="card">
        <h3>准星参数</h3>

        <div class="row"><label>X (-1居中)</label>
          <div class="spin"><button class="btn" data-step-target="x" data-step="-1">-</button><input id="x" /><button
              class="btn" data-step-target="x" data-step="1">+</button></div>
        </div>
        <div class="row"><label>Y (-1居中)</label>
          <div class="spin"><button class="btn" data-step-target="y" data-step="-1">-</button><input id="y" /><button
              class="btn" data-step-target="y" data-step="1">+</button></div>
        </div>
        <div class="row"><label>窗口尺寸</label>
          <div class="spin"><button class="btn" data-step-target="window_size" data-step="-1">-</button><input
              id="window_size" /><button class="btn" data-step-target="window_size" data-step="1">+</button></div>
        </div>
        <div class="row"><label>准星半径</label>
          <div class="spin"><button class="btn" data-step-target="cross_half" data-step="-1">-</button><input
              id="cross_half" /><button class="btn" data-step-target="cross_half" data-step="1">+</button></div>
        </div>
        <div class="row"><label>线宽</label>
          <div class="spin"><button class="btn" data-step-target="line_width" data-step="-1">-</button><input
              id="line_width" /><button class="btn" data-step-target="line_width" data-step="1">+</button></div>
        </div>
        <div class="row"><label>颜色 R</label>
          <div class="spin"><button class="btn" data-step-target="color_r" data-step="-1">-</button><input
              id="color_r" /><button class="btn" data-step-target="color_r" data-step="1">+</button></div>
        </div>
        <div class="row"><label>颜色 G</label>
          <div class="spin"><button class="btn" data-step-target="color_g" data-step="-1">-</button><input
              id="color_g" /><button class="btn" data-step-target="color_g" data-step="1">+</button></div>
        </div>
        <div class="row"><label>颜色 B</label>
          <div class="spin"><button class="btn" data-step-target="color_b" data-step="-1">-</button><input
              id="color_b" /><button class="btn" data-step-target="color_b" data-step="1">+</button></div>
        </div>

        <div class="row"><label>颜色预览</label>
          <div class="swatch" id="swatch"></div>
        </div>
      </section>
    </div>

    <div class="status">
      <div class="left"><span class="dot" id="dot"></span><span id="st">状态: 已停止</span></div>
      <div class="actions"><button class="pri" id="toggleBtn">启动准星</button></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>

</html>
