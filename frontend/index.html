<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyCross 控制台</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="wrap">
    <div class="head">
      <div>
        <div class="title">MyCross 控制台</div>
        <div class="sub">全新重构版 · Web UI + 本地服务</div>
      </div>
      <div class="badge">热键关闭准星: Ctrl + Alt + Shift + F12</div>
    </div>

    <div class="grid">
      <section class="card">
        <h3>配置管理</h3>
        <div class="row"><label>已存在配置</label><select id="profileSelect"></select></div>
        <div class="row"><label>配置名</label><input id="profileName" placeholder="例如: sniper.ini" /></div>
        <div class="row2">
          <button class="btn" id="newBtn">新建</button>
          <button class="btn" id="renameBtn">重命名</button>
        </div>
        <div class="row2" style="margin-top:8px;">
          <button class="pri" id="saveBtn">保存当前配置</button>
          <button class="danger" id="quitBtn">退出程序</button>
        </div>
      </section>

      <section class="card">
        <h3>准星参数</h3>

        <div class="row"><label>X (-1居中)</label>
          <div class="spin"><button class="btn" data-step-target="x" data-step="-1">-</button><input id="x" /><button
              class="btn" data-step-target="x" data-step="1">+</button></div>
        </div>
        <div class="row"><label>Y (-1居中)</label>
          <div class="spin"><button class="btn" data-step-target="y" data-step="-1">-</button><input id="y" /><button
              class="btn" data-step-target="y" data-step="1">+</button></div>
        </div>
        <div class="row"><label>窗口尺寸</label>
          <div class="spin"><button class="btn" data-step-target="window_size" data-step="-1">-</button><input
              id="window_size" /><button class="btn" data-step-target="window_size" data-step="1">+</button></div>
        </div>
        <div class="row"><label>准星半径</label>
          <div class="spin"><button class="btn" data-step-target="cross_half" data-step="-1">-</button><input
              id="cross_half" /><button class="btn" data-step-target="cross_half" data-step="1">+</button></div>
        </div>
        <div class="row"><label>线宽</label>
          <div class="spin"><button class="btn" data-step-target="line_width" data-step="-1">-</button><input
              id="line_width" /><button class="btn" data-step-target="line_width" data-step="1">+</button></div>
        </div>
        <div class="row"><label>颜色 R</label>
          <div class="spin"><button class="btn" data-step-target="color_r" data-step="-1">-</button><input
              id="color_r" /><button class="btn" data-step-target="color_r" data-step="1">+</button></div>
        </div>
        <div class="row"><label>颜色 G</label>
          <div class="spin"><button class="btn" data-step-target="color_g" data-step="-1">-</button><input
              id="color_g" /><button class="btn" data-step-target="color_g" data-step="1">+</button></div>
        </div>
        <div class="row"><label>颜色 B</label>
          <div class="spin"><button class="btn" data-step-target="color_b" data-step="-1">-</button><input
              id="color_b" /><button class="btn" data-step-target="color_b" data-step="1">+</button></div>
        </div>

        <div class="row"><label>颜色预览</label>
          <div class="swatch" id="swatch"></div>
        </div>
      </section>
    </div>

    <div class="status">
      <div class="left"><span class="dot" id="dot"></span><span id="st">状态: 已停止</span></div>
      <div class="actions"><button class="pri" id="toggleBtn">启动准星</button></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>

</html>
