<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyCross 控制台</title>
  <style>
    :root{--bg:#0b1220;--card:#121b2e;--line:#23314b;--txt:#eaf0ff;--sub:#9fb0d2;--ok:#22c55e;--danger:#fb7185;--acc:#22d3ee}
    *{box-sizing:border-box}
    body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:radial-gradient(1200px 700px at 20% -20%,#19305a 0%,transparent 65%),radial-gradient(900px 600px at 100% 0%,#0a3644 0%,transparent 60%),var(--bg);color:var(--txt)}
    .wrap{max-width:1080px;margin:28px auto;padding:0 16px}
    .head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px}
    .title{font-size:30px;font-weight:800}
    .sub{font-size:13px;color:var(--sub)}
    .badge{font-size:12px;color:#cde6ff;border:1px solid var(--line);background:#0f1729;padding:8px 12px;border-radius:999px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .card{background:linear-gradient(180deg,#16233b,#111b2f);border:1px solid var(--line);border-radius:14px;padding:14px}
    h3{margin:0 0 12px;font-size:16px}
    .row{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;margin-bottom:9px}
    .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    label{font-size:13px;color:var(--sub)}
    input,select,button{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #2b3d5c;background:#0c1425;color:var(--txt);font-size:14px}
    input:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
    button{cursor:pointer;font-weight:700}
    .btn{background:#182742}.btn:hover{background:#1c2d4d}
    .pri{background:linear-gradient(135deg,#34d399,#22d3ee);border:0;color:#032228}
    .danger{background:linear-gradient(135deg,#fb7185,#f43f5e);border:0;color:#fff}
    .status{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#10192a}
    .left{display:flex;align-items:center;gap:10px}
    .dot{width:10px;height:10px;border-radius:999px;background:var(--danger);box-shadow:0 0 10px rgba(251,113,133,.7)}
    .dot.on{background:var(--ok);box-shadow:0 0 10px rgba(34,197,94,.7)}
    .swatch{height:70px;border-radius:10px;border:1px solid var(--line);background:rgb(0,255,0)}
    .actions{display:flex;gap:8px}

    .spin{display:grid;grid-template-columns:38px 1fr 38px;gap:6px;align-items:center}
    .spin input{padding:10px 8px;text-align:center}
    .spin button{padding:10px 0;font-size:18px;line-height:1}

    @media (max-width:900px){.grid{grid-template-columns:1fr}.head{flex-direction:column;align-items:flex-start}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div>
        <div class="title">MyCross 控制台</div>
        <div class="sub">全新重构版 · Web UI + 本地服务</div>
      </div>
      <div class="badge">热键关闭准星: Ctrl + Alt + Shift + F12</div>
    </div>

    <div class="grid">
      <section class="card">
        <h3>配置管理</h3>
        <div class="row"><label>已存在配置</label><select id="profileSelect"></select></div>
        <div class="row"><label>配置名</label><input id="profileName" placeholder="例如: sniper.ini" /></div>
        <div class="row3">
          <button class="btn" id="loadBtn">加载</button>
          <button class="btn" id="newBtn">新建</button>
          <button class="btn" id="renameBtn">重命名</button>
        </div>
        <div class="row3" style="margin-top:8px;">
          <button class="pri" id="saveBtn">保存当前配置</button>
          <div></div>
          <button class="danger" id="quitBtn">退出程序</button>
        </div>
      </section>

      <section class="card">
        <h3>准星参数</h3>

        <div class="row"><label>X (-1居中)</label><div class="spin"><button class="btn" data-step-target="x" data-step="-1">-</button><input id="x" /><button class="btn" data-step-target="x" data-step="1">+</button></div></div>
        <div class="row"><label>Y (-1居中)</label><div class="spin"><button class="btn" data-step-target="y" data-step="-1">-</button><input id="y" /><button class="btn" data-step-target="y" data-step="1">+</button></div></div>
        <div class="row"><label>窗口尺寸</label><div class="spin"><button class="btn" data-step-target="window_size" data-step="-1">-</button><input id="window_size" /><button class="btn" data-step-target="window_size" data-step="1">+</button></div></div>
        <div class="row"><label>准星半径</label><div class="spin"><button class="btn" data-step-target="cross_half" data-step="-1">-</button><input id="cross_half" /><button class="btn" data-step-target="cross_half" data-step="1">+</button></div></div>
        <div class="row"><label>线宽</label><div class="spin"><button class="btn" data-step-target="line_width" data-step="-1">-</button><input id="line_width" /><button class="btn" data-step-target="line_width" data-step="1">+</button></div></div>
        <div class="row"><label>颜色 R</label><div class="spin"><button class="btn" data-step-target="color_r" data-step="-1">-</button><input id="color_r" /><button class="btn" data-step-target="color_r" data-step="1">+</button></div></div>
        <div class="row"><label>颜色 G</label><div class="spin"><button class="btn" data-step-target="color_g" data-step="-1">-</button><input id="color_g" /><button class="btn" data-step-target="color_g" data-step="1">+</button></div></div>
        <div class="row"><label>颜色 B</label><div class="spin"><button class="btn" data-step-target="color_b" data-step="-1">-</button><input id="color_b" /><button class="btn" data-step-target="color_b" data-step="1">+</button></div></div>

        <div class="row"><label>颜色预览</label><div class="swatch" id="swatch"></div></div>
      </section>
    </div>

    <div class="status">
      <div class="left"><span class="dot" id="dot"></span><span id="st">状态: 已停止</span></div>
      <div class="actions"><button class="pri" id="toggleBtn">启动准星</button></div>
    </div>
  </div>

  <script>
    const keys=["x","y","window_size","cross_half","line_width","color_r","color_g","color_b"];
    const limits={x:[-1,10000],y:[-1,10000],window_size:[20,800],cross_half:[1,400],line_width:[1,20],color_r:[0,255],color_g:[0,255],color_b:[0,255]};
    const $=id=>document.getElementById(id);

    async function post(path,obj={}){const body=new URLSearchParams(obj).toString();const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body});if(!r.ok)throw new Error(await r.text()||`HTTP ${r.status}`);const ct=r.headers.get("content-type")||"";return ct.includes("application/json")?r.json():r.text();}
    async function state(){const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw new Error(await r.text()||'state fail');return r.json();}

    function formData(){const o={};keys.forEach(k=>o[k]=$(k).value.trim());return o}
    function fill(cfg){keys.forEach(k=>$(k).value=cfg[k]);paintSwatch()}
    function paintSwatch(){const r=Number($("color_r").value||0),g=Number($("color_g").value||0),b=Number($("color_b").value||0);$("swatch").style.background=`rgb(${r},${g},${b})`}
    function normName(n){n=(n||"").trim();if(!n)return"";return /\.ini$/i.test(n)?n:`${n}.ini`;}
    function clampByKey(key,v){const [a,b]=limits[key]||[-999999,999999];return Math.max(a,Math.min(b,v));}

    let dirty=false,inAutoApply=false;
    function render(s,forceFill=false){const sel=$("profileSelect");const cur=s.active_profile||"";sel.innerHTML="";(s.profiles||[]).forEach(n=>{const op=document.createElement("option");op.value=n;op.textContent=n;if(n===cur)op.selected=true;sel.appendChild(op)});if(forceFill||!dirty){$("profileName").value=cur;fill(s.config)}const on=!!s.running;$("dot").classList.toggle("on",on);$("st").textContent=on?"状态: 运行中":"状态: 已停止";$("toggleBtn").textContent=on?"停止准星":"启动准星"}
    async function refresh(){try{render(await state(),false)}catch(e){alert(`刷新失败: ${e.message}`)}}

    async function autoApplyNow(){if(inAutoApply)return;inAutoApply=true;try{const s=await post('/api/apply',formData());dirty=false;render(s,false)}catch(e){alert(`自动应用失败: ${e.message}`)}finally{inAutoApply=false}}

    keys.forEach(k=>{const el=$(k);el.addEventListener('input',()=>{dirty=true;paintSwatch()});el.addEventListener('blur',()=>{if(dirty)autoApplyNow()});el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();autoApplyNow()}})});

    document.querySelectorAll('[data-step-target]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const key=btn.getAttribute('data-step-target');
        const step=Number(btn.getAttribute('data-step')||1);
        const el=$(key);
        const cur=Number(el.value||0);
        const next=clampByKey(key, Number.isFinite(cur)?cur+step:step);
        el.value=String(next);
        dirty=true;
        paintSwatch();
        autoApplyNow();
      });
    });

    $("toggleBtn").onclick=async()=>{try{const s=await state();render(await post('/api/toggle',{running:s.running?0:1}),false)}catch(e){alert(`切换失败: ${e.message}`)}};
    $("loadBtn").onclick=async()=>{const n=$("profileSelect").value;if(!n)return;try{const s=await post('/api/profile/load',{name:n});dirty=false;render(s,true)}catch(e){alert(`加载失败: ${e.message}`)}};
    $("saveBtn").onclick=async()=>{try{const s=await post('/api/profile/save',{...formData(),name:$("profileName").value.trim()});dirty=false;render(s,true)}catch(e){alert(`保存失败: ${e.message}`)}};
    $("newBtn").onclick=async()=>{const n=$("profileName").value.trim();if(!n)return alert('请先输入配置名');try{const s=await post('/api/profile/new',{...formData(),name:n});dirty=false;render(s,true)}catch(e){alert(`新建失败: ${e.message}`)}};
    $("renameBtn").onclick=async()=>{const oldn=$("profileSelect").value;const newn=$("profileName").value.trim();if(!oldn)return alert('请先选择配置');if(!newn)return alert('请先输入新配置名');if(oldn.toLowerCase()===normName(newn).toLowerCase())return alert('新旧配置名相同');try{const s=await post('/api/profile/rename',{old_name:oldn,new_name:newn});dirty=false;render(s,true)}catch(e){alert(`重命名失败: ${e.message}`)}};
    $("quitBtn").onclick=async()=>{if(!confirm('确认退出程序？'))return;try{await post('/api/quit',{});window.close()}catch(e){alert(`退出失败: ${e.message}`)}};

    $("profileSelect").addEventListener('change',async()=>{const n=$("profileSelect").value;$("profileName").value=n;if(!n)return;try{const s=await post('/api/profile/load',{name:n});dirty=false;render(s,true)}catch(e){alert(`自动加载失败: ${e.message}`)}});

    async function ping(){try{await post('/api/ping',{})}catch(_){}}
    setInterval(ping,1000);
    window.addEventListener('beforeunload',()=>{navigator.sendBeacon('/api/quit','')});
    refresh();
  </script>
</body>
</html>
